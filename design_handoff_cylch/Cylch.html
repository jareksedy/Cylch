<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cylch — Adalight Controller</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background:
      radial-gradient(circle at 30% 20%, #1f2230 0%, transparent 55%),
      radial-gradient(circle at 75% 85%, #221a2c 0%, transparent 55%),
      linear-gradient(135deg, #0a0b0f 0%, #111218 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="macos-window.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="cylch-app.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "ledCount": 65
}/*EDITMODE-END*/;

const PORTS = [
  '/dev/cu.usbserial-A50285BI',
  '/dev/cu.usbmodem14201',
  '/dev/cu.SLAB_USBtoUART',
];

// Slider tracks: subtle, monochromatic, lit by a single accent.
// They read as "more / less" rather than competing palettes.
const BRIGHTNESS_GRADIENT =
  'linear-gradient(90deg, #2a2d36 0%, #ffffff 100%)';
const SPEED_GRADIENT =
  'linear-gradient(90deg, #2a2d36 0%, #6979ff 100%)';

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [speed, setSpeed] = React.useState(60);
  const [brightness, setBrightness] = React.useState(80);
  const [port, setPort] = React.useState(PORTS[0]);
  const [connected, setConnected] = React.useState(true);

  return (
    <div data-screen-label="Cylch — Main">
      <MacWindow width={540} height={320} title="Cylch">
        <div style={{
          height: '100%', display: 'flex', flexDirection: 'column',
          padding: '18px 22px 20px', gap: 18, boxSizing: 'border-box',
        }}>
          {/* sliders */}
          <GradientSlider
            label="Brightness"
            value={brightness}
            onChange={setBrightness}
            unit="%"
            gradient={BRIGHTNESS_GRADIENT}
          />
          <GradientSlider
            label="Speed"
            value={speed}
            onChange={setSpeed}
            gradient={SPEED_GRADIENT}
          />

          {/* status line */}
          <div style={{
            fontFamily: MONO, fontSize: 11, lineHeight: 1.4,
            color: 'rgba(255,255,255,0.55)',
            display: 'flex', alignItems: 'center', gap: 8,
          }}>
            <span style={{
              width: 6, height: 6, borderRadius: '50%',
              background: connected ? '#34d674' : '#7a7a7a',
              boxShadow: connected ? '0 0 6px #34d674' : 'none',
              flexShrink: 0,
            }} />
            <span style={{ color: 'rgba(255,255,255,0.85)' }}>
              {connected ? 'Streaming rainbow' : 'Idle'}
            </span>
            <span style={{ color: 'rgba(255,255,255,0.3)' }}>·</span>
            <span>{t.ledCount} LEDs</span>
            <span style={{ color: 'rgba(255,255,255,0.3)' }}>·</span>
            <span>{brightness}% bright</span>
            <span style={{ color: 'rgba(255,255,255,0.3)' }}>·</span>
            <span>speed {speed}</span>
          </div>

          <div style={{ flex: 1 }} />

          {/* footer: port + leds + connect */}
          <div style={{ display: 'flex', gap: 12, alignItems: 'flex-end' }}>
            <Field label="Serial Port">
              <Select value={port} onChange={setPort} options={PORTS} width={200} />
            </Field>
            <Field label="LEDs">
              <NumberInput value={t.ledCount} onChange={(v) => setTweak('ledCount', v)} min={1} max={300} />
            </Field>
            <div style={{ flex: 1 }} />
            <ConnectButton connected={connected} onToggle={() => setConnected(c => !c)} />
          </div>
        </div>
      </MacWindow>


    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
